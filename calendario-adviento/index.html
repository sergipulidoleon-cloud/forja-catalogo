<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3d3e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calendario de Adviento para Nadia</title>

<!-- =====================================================================
     ✏️  CONTENIDO EDITABLE
     Todo lo que se ve en el calendario está en este objeto CONFIG.
     - Cambia los textos entre comillas "..." o entre acentos graves `...`
       (los acentos graves permiten varias líneas; deja una línea en blanco
       para separar párrafos).
     - Las rutas de fotos/GIFs/música son relativas a este archivo:
       "fotos/foto1.jpg" = carpeta "fotos" junto a index.html.
     - Si una foto no existe, se ve un marco bonito de "pon aquí tu foto".
     - Tipos de día disponibles: bienvenida, cancion, frase, vale, foto,
       dato, juego (memory | estrellas | quiz), mapa, stitch, carta, final.
       ¡Intenta no repetir el mismo tipo dos días seguidos! (si lo haces,
       la consola del navegador te avisa).
     ===================================================================== -->
<script>
const CONFIG = {
  nombre: "Nadia",                 // ✏️ su nombre
  firma: "Tu chico, que te quiere 💕", // ✏️ cómo firmas las cartas
  anio: 2026,                      // año del calendario (se abre del 1 al 24 de diciembre de este año)
  zonaHoraria: "Europe/Madrid",    // hora de España

  // Pantalla de inicio (el botón sirve también para que arranque el audio)
  inicio: {
    titulo: "Para Nadia",
    subtitulo: "Por un mes lleno de felicidad, igual que la que me das tú a mí",
    boton: "Entrar ✨"
  },

  // Título de arriba. ¡Truco! Tocarlo 5 veces seguidas activa el MODO PRUEBA
  // (abre todos los días sin guardar nada, para que tú lo revises).
  tituloCalendario: "El Adviento de Nadia",

  // Nombres de los gatitos (salen al tocarlos)
  gatitos: {
    dormilon: "Algodón",   // el que duerme encima del regalo
    jugueton: "Canela",    // el que juega con la bola del árbol
    paseante: "Nube"       // el que pasea alrededor del árbol
  },

  // Mensajes cuando intenta abrir una cajita antes de tiempo.
  // {dia} se sustituye por el número del día.
  mensajesPaciencia: [
    "¡Paciencia, curiosa! 😼",
    "¡Miau! Esta cajita todavía está echándose la siesta.",
    "Ni con ojitos de gato con botas se abre antes de tiempo 🥺",
    "Los regalos no se abren mirándolos fijamente… (lo he comprobado) 👀",
    "Shhh… vuelve el día {dia}, que aún la estoy envolviendo 🎀",
    "¡Alto ahí! El gatito de seguridad dice que no 🐾"
  ],

  // Animalitos escondidos por la escena. Al encontrar los 3 se desbloquea esto:
  sorpresaAnimales: {
    titulo: "¡Los has encontrado a todos!",
    texto: `El perrito, el conejito y el pingüino estaban escondidos esperándote… y tú, con esos ojos que lo ven todo, los has encontrado.

Como premio, aquí tienes un vale extra:`,
    vale: "Vale por un peluche del animalito que tú elijas 🧸",
    detalle: "Lo elegimos juntos y le ponemos nombre."
  },

  // ===================================================================
  // LOS 24 DÍAS
  // ===================================================================
  dias: {
    // ---------- DÍA 1: bienvenida ----------
    1: {
      tipo: "bienvenida",
      titulo: "¡Bienvenida a tu calendario de Adviento!",
      texto: `Hola, mi amor 💕

He preparado este calendario para que diciembre tenga un poquito de magia cada día. Hay 24 cajitas colgadas del árbol y cada una solo se abre en su día (hora de España, ¡no vale hacer trampas!).

Dentro vas a encontrar canciones, vales canjeables, fotos nuestras, minijuegos y alguna sorpresa más. Y ojo: por la escena hay gatitos (tócalos, que maúllan) y unos cuantos animalitos escondidos… si los encuentras a todos, pasa algo especial.

Gira la escena con el dedo, pellizca para hacer zoom y… ¡a disfrutar!`
    },

    // ---------- DÍA 2: canción ----------
    // spotify / youtube: pega el enlace de la canción (opcional).
    //   - Si lo pegas, se ve el reproductor dentro de la tarjeta.
    //   - Si lo dejas vacío "", salen botones que buscan la canción.
    2: {
      tipo: "cancion",
      titulo: "Night Changes",
      artista: "One Direction",
      nota: "Esta me recuerda a esas noches en las que el tiempo se nos pasa volando hablando de todo.", // ✏️
      spotify: "",   // ✏️ ej: "https://open.spotify.com/track/XXXXXXXX"
      youtube: ""    // ✏️ ej: "https://www.youtube.com/watch?v=XXXXXXXXXXX"
    },

    // ---------- DÍA 3: dato curioso ----------
    3: {
      tipo: "dato",
      emoji: "😴",
      titulo: "Expertos en siestas",
      texto: "Los gatos duermen entre 12 y 16 horas al día. Vamos, que se pasan más de media vida soñando.",
      extra: "Y su ronroneo vibra entre 25 y 150 hercios: hay estudios que lo relacionan con ayudar a relajarse y a curar huesos y tejidos."
    },

    // ---------- DÍA 4: vale ----------
    4: {
      tipo: "vale",
      emoji: "🌅",
      titulo: "Vale por un paseo al atardecer",
      detalle: "Tú eliges el sitio. Yo pongo la mano para dártela y el abrigo por si hace frío."
    },

    // ---------- DÍA 5: fotos (marco polaroid) ----------
    // Pon tus fotos en la carpeta "fotos" y escribe aquí sus nombres.
    5: {
      tipo: "foto",
      titulo: "Un recuerdo nuestro",
      fotos: [
        { src: "fotos/foto1.jpg", pie: "Aquí ya sabía que eras tú ✨" },   // ✏️
        { src: "fotos/foto2.jpg", pie: "Mi sitio favorito: a tu lado" }    // ✏️
      ]
    },

    // ---------- DÍA 6: minijuego memory ----------
    6: {
      tipo: "juego",
      juego: "memory",
      titulo: "Memory de animalitos",
      intro: "Encuentra todas las parejas. ¡Sin prisa, que no hay tiempo!",
      emojis: ["🐱", "🐶", "🐰", "🐧", "🦊", "🐼"],
      premio: "¡Conseguido! Tu premio: un abrazo de los que duran mucho 🤗"
    },

    // ---------- DÍA 7: frase ----------
    7: {
      tipo: "frase",
      texto: "Contigo hasta los lunes parecen viernes." // ✏️ tu frase
    },

    // ---------- DÍA 8: día de Stitch ----------
    // Mete tus imágenes o GIFs en la carpeta "stitch".
    8: {
      tipo: "stitch",
      titulo: "Día de Stitch 💙",
      imagenes: ["stitch/stitch1.gif"],   // ✏️ puedes poner varias
      frase: "Ohana significa familia, y en la familia nadie se queda atrás. Tú eres la mía.",
      texto: "Hoy toca ser un poquito traviesa, como él 👽🌺"
    },

    // ---------- DÍA 9: canción ----------
    9: {
      tipo: "cancion",
      titulo: "Perfect",
      artista: "One Direction",
      nota: "Para cantarla a gritos en el coche (desafinando, como siempre).", // ✏️
      spotify: "",
      youtube: ""
    },

    // ---------- DÍA 10: dato curioso ----------
    10: {
      tipo: "dato",
      emoji: "🐾",
      titulo: "El maullido es para ti",
      texto: "Los gatos adultos casi no se maúllan entre ellos: el maullido lo usan sobre todo para hablar con las personas.",
      extra: "Además, la nariz de cada gato tiene un dibujo único, como si fuera su huella dactilar."
    },

    // ---------- DÍA 11: minijuego atrapar estrellas ----------
    11: {
      tipo: "juego",
      juego: "estrellas",
      titulo: "Atrapa las estrellas",
      intro: "Arrastra al gatito con el dedo y atrapa 20 estrellas en 30 segundos. ¡Los pescaditos valen triple! 🐟",
      meta: 20,
      segundos: 30,
      premio: "¡Eres una estrella atrapando estrellas! Premio: te debo un chocolate caliente ☕"
    },

    // ---------- DÍA 12: vale ----------
    12: {
      tipo: "vale",
      emoji: "🎁",
      titulo: "Vale por una cita sorpresa",
      detalle: "Tú solo dime el día. Yo me encargo de todo lo demás (y no pienso darte pistas)."
    },

    // ---------- DÍA 13: fotos ----------
    13: {
      tipo: "foto",
      titulo: "Otro trocito de nosotros",
      fotos: [
        { src: "fotos/foto3.jpg", pie: "Qué guapa estabas (y estás)" }, // ✏️
        { src: "fotos/foto4.jpg", pie: "Repetimos, ¿vale?" }            // ✏️
      ]
    },

    // ---------- DÍA 14: CARTA LARGA (con sobre animado) ----------
    // Si vuestra fecha especial es otro día, mueve este bloque a ese número
    // y pon en el 14 lo que había en ese día.
    14: {
      tipo: "carta",
      titulo: "Una carta para ti",
      texto: `Mi niña:

Hoy no hay juego ni vale, hoy toca algo más de verdad. Llevo días pensando cómo decirte todo lo que me haces sentir y he llegado a la conclusión de que no me caben las palabras, pero voy a intentarlo.

Gracias por hacer que los días normales se conviertan en días bonitos. Por tu risa, por cómo te emocionas con cualquier gatito que se cruza por la calle, por tu paciencia conmigo y por esa forma tan tuya de cuidar a todo el mundo.

Contigo he aprendido que el hogar no es un sitio, es una persona. Y la mía eres tú.

Ojalá este diciembre sea solo el primero de muchos. Te quiero muchísimo.` // ✏️ escribe aquí tu carta
    },

    // ---------- DÍA 15: mapa de nuestros sitios ----------
    // lat / lng: en Google Maps, mantén pulsado un sitio y copia los dos números.
    15: {
      tipo: "mapa",
      titulo: "Nuestros paseos",
      texto: "Algunos sitios donde hemos dejado huellita juntos 🐾 (toca cada uno)",
      lugares: [ // ✏️ cambia por vuestros sitios
        { nombre: "Parque del Retiro", lat: 40.4153, lng: -3.6844, emoji: "🌳", recuerdo: "Aquel paseo en el que no paramos de reír." },
        { nombre: "Templo de Debod", lat: 40.4240, lng: -3.7178, emoji: "🌅", recuerdo: "El atardecer más bonito… y tú más." },
        { nombre: "Plaza Mayor", lat: 40.4155, lng: -3.7074, emoji: "🎄", recuerdo: "Luces de Navidad y chocolate con churros." }
      ]
    },

    // ---------- DÍA 16: frase ----------
    16: {
      tipo: "frase",
      texto: "Si tuviera que elegir otra vez, te elegiría en todas las vidas." // ✏️
    },

    // ---------- DÍA 17: canción ----------
    17: {
      tipo: "cancion",
      titulo: "You & I",
      artista: "One Direction",
      nota: "Tú y yo. No hace falta decir más.", // ✏️
      spotify: "",
      youtube: ""
    },

    // ---------- DÍA 18: quiz sobre nosotros ----------
    // correcta = posición de la respuesta buena empezando en 0 (0 = la primera).
    18: {
      tipo: "juego",
      juego: "quiz",
      titulo: "¿Cuánto sabes de nosotros?",
      intro: "Cinco preguntas. Sin mirar el móvil… ¡ah, no, que es el móvil! 😂",
      preguntas: [ // ✏️ cambia las preguntas y respuestas
        { pregunta: "¿Qué grupo cantamos siempre a gritos?", opciones: ["One Direction", "Los Chunguitos", "Metallica"], correcta: 0 },
        { pregunta: "¿Qué animal te derrite el corazón en 0,5 segundos?", opciones: ["Un pez", "Un gatito", "Una lagartija"], correcta: 1 },
        { pregunta: "¿Cuál es nuestro plan favorito?", opciones: ["Hacer la declaración de la renta", "Pelis con mantita", "Madrugar"], correcta: 1 },
        { pregunta: "¿Quién dice antes 'te quiero' al despedirse?", opciones: ["Tú", "Yo", "Empate eterno"], correcta: 2 },
        { pregunta: "¿Cuánto te quiero?", opciones: ["Mucho", "Muchísimo", "Más que a nada"], correcta: 2 }
      ],
      premio: "¡Nos conoces de memoria! 💯"
    },

    // ---------- DÍA 19: vale ----------
    19: {
      tipo: "vale",
      emoji: "🍿",
      titulo: "Vale por un maratón de pelis con mantita",
      detalle: "Incluye palomitas, chocolate y derecho a dormirte en la segunda peli sin que me queje."
    },

    // ---------- DÍA 20: dato curioso ----------
    20: {
      tipo: "dato",
      emoji: "🐧",
      titulo: "Amor de pingüino",
      texto: "Algunos pingüinos, como los papúa y los de Adelia, buscan piedrecitas bonitas y se las regalan a su pareja para construir juntos el nido.",
      extra: "Y los conejos, cuando están muy felices, pegan unos saltitos en el aire con giro incluido. Se llaman 'binkies' 🐰"
    },

    // ---------- DÍA 21: día de Stitch ----------
    21: {
      tipo: "stitch",
      titulo: "Día de Stitch 💙",
      imagenes: ["stitch/stitch2.gif", "stitch/stitch3.gif"], // ✏️
      frase: "Pase lo que pase, nunca te voy a dejar atrás. Somos familia.",
      texto: "Pequeña, rota, pero buena. Como dice él. Y nuestra familia es la mejor 🌺"
    },

    // ---------- DÍA 22: vale ----------
    22: {
      tipo: "vale",
      emoji: "🐾",
      titulo: "Vale por ir a ver animales",
      detalle: "Protectora, granja escuela, zoo… tú eliges. Prometo no adoptar diez gatos el mismo día (bueno, igual uno)."
    },

    // ---------- DÍA 23: fotos ----------
    23: {
      tipo: "foto",
      titulo: "Casi, casi Navidad",
      fotos: [
        { src: "fotos/foto5.jpg", pie: "Mi persona favorita del mundo" } // ✏️
      ]
    },

    // ---------- DÍA 24: FINAL ÉPICO ----------
    // cancion.audio: pon un mp3 vuestro en la carpeta "musica" para que suene
    // de fondo con los fuegos artificiales. Si lo dejas vacío, se usa el
    // enlace de youtube (si lo hay) o un botón para buscarla.
    24: {
      tipo: "final",
      titulo: "¡Feliz Nochebuena, mi amor!",
      cancion: {
        titulo: "Nuestra canción",   // ✏️
        artista: "One Direction",    // ✏️
        audio: "musica/nuestra-cancion.mp3", // ✏️ ruta al mp3 (opcional)
        youtube: ""                  // ✏️ enlace de YouTube (opcional)
      },
      carta: `Hemos llegado al final del calendario, pero no al final de nada.

Gracias por abrir cada cajita, por cada sonrisa que espero haberte sacado y por dejarme quererte cada día un poquito más.

Mira la escena: todos los gatitos se han juntado para decírtelo conmigo. Feliz Navidad, mi vida. Eres mi regalo favorito.` // ✏️ [MENSAJE FINAL]
    }
  }
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#f6c1d1; --pink-d:#e2849f; --rose:#c0577f;
  --blue:#b9d7f2; --blue-d:#6f9fd1; --navy:#4b5d86;
  --cream:#fff8ee; --cream-d:#f6e7cf;
  --gold:#e2b65b; --gold-d:#b98a2e; --gold-l:#f6dfa4;
  --lilac:#d9c8f0; --mint:#c4e6d6;
  --ink:#5a4a5e; --ink-soft:#8a7a8e;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#9fbde3 0%,#c9c4ea 38%,#f3d3e0 70%,#fdf1e4 100%);
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- Intro ---------- */
#intro{
  position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));text-align:center;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#bcd3f0 0%,#e7cfe8 45%,#fbe3e7 75%,#fff4e6 100%);
  transition:opacity .9s ease,visibility .9s;
}
#intro.hide{opacity:0;visibility:hidden}
#intro .flake{position:absolute;top:-20px;color:#fff;opacity:.85;animation:fall linear infinite;pointer-events:none;text-shadow:0 0 6px rgba(255,255,255,.8)}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.intro-gift{font-size:64px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(160,100,140,.25))}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
#intro h1{font-family:"Caveat",cursive;font-weight:700;font-size:clamp(54px,15vw,86px);line-height:1;margin:10px 0 6px;
  color:var(--rose);text-shadow:0 2px 0 #fff,0 6px 18px rgba(192,87,127,.25)}
#intro p{font-size:clamp(17px,4.6vw,21px);line-height:1.45;max-width:420px;margin:0 0 30px;color:var(--ink);font-weight:500}
#intro p::before,#intro p::after{content:"✦";color:var(--gold);margin:0 8px}
.btn{
  border:0;border-radius:999px;padding:14px 30px;font-size:19px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,#f0c86f,#d6a43f);box-shadow:0 6px 0 #b98a2e,0 12px 24px rgba(185,138,46,.35);
  transition:transform .12s,box-shadow .12s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b98a2e,0 6px 12px rgba(185,138,46,.3)}
.btn:disabled{filter:grayscale(.5);opacity:.75}
.btn.pink{background:linear-gradient(180deg,#f4a9c0,#e2849f);box-shadow:0 6px 0 #c0577f,0 12px 24px rgba(192,87,127,.3)}
.btn.blue{background:linear-gradient(180deg,#9cc3ec,#6f9fd1);box-shadow:0 6px 0 #4b77a8,0 12px 24px rgba(75,119,168,.3)}
.btn.small{padding:10px 18px;font-size:16px}
.btn.ghost{background:#fff;color:var(--rose);box-shadow:0 4px 0 #ecd2db}
#introErr{margin-top:18px;color:var(--rose);font-size:15px;max-width:340px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#hud > *{pointer-events:auto}
#hud > #topbar{pointer-events:none}
#topbar > *{pointer-events:auto}
#topbar{position:absolute;top:calc(10px + var(--safe-t));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 70px}
#title{
  background:rgba(255,248,238,.82);border:2px solid var(--gold-l);border-radius:999px;padding:7px 16px;
  font-family:"Caveat",cursive;font-size:clamp(21px,6.4vw,27px);font-weight:700;color:var(--rose);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 4px 14px rgba(120,90,140,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:100%;
}
#countdown{
  background:rgba(255,255,255,.7);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500;color:var(--navy);
  box-shadow:0 2px 8px rgba(120,90,140,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center
}
.side{position:absolute;top:calc(12px + var(--safe-t));display:flex;flex-direction:column;gap:8px}
.side.left{left:12px}.side.right{right:12px}
.round{
  width:46px;height:46px;border-radius:50%;border:2px solid var(--gold-l);background:rgba(255,248,238,.86);font-size:21px;
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(120,90,140,.18);padding:0;color:var(--ink)
}
#pawBtn{font-size:13px;font-weight:600;flex-direction:column;line-height:1}
#pawBtn span{font-size:18px;display:block}
#testBadge{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + var(--safe-b));
  background:#4b5d86;color:#fff;border-radius:14px;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;white-space:nowrap;
  box-shadow:0 6px 16px rgba(0,0,0,.2)
}
#testBadge[hidden]{display:none}
#testBadge button{border:0;border-radius:999px;padding:6px 10px;background:#fff;color:#4b5d86;font-weight:600;font-size:13px}
#hint{
  position:absolute;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);
  background:rgba(255,248,238,.9);border-radius:999px;padding:9px 16px;font-size:15px;white-space:nowrap;color:var(--ink);
  box-shadow:0 4px 14px rgba(120,90,140,.18);transition:opacity .6s;pointer-events:none
}
#hint.hide{opacity:0}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:10;font-size:18px;color:var(--ink-soft);pointer-events:none}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;top:calc(110px + var(--safe-t));transform:translate(-50%,-20px);z-index:70;opacity:0;pointer-events:none;
  background:#fff;color:var(--ink);border-radius:18px;padding:10px 16px;font-size:16px;font-weight:500;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 10px 30px rgba(120,90,140,.25);border:2px solid var(--gold-l);transition:opacity .3s,transform .3s
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Gatito "paciencia" ---------- */
#patience{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  background:rgba(80,60,100,.18);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#patience.show{opacity:1;visibility:visible}

}

/* canción */
.vinyl{width:150px;height:150px;margin:8px auto 14px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle,#3c3650 0 2px,#4a4462 2px 4px);box-shadow:0 10px 24px rgba(60,40,80,.3);animation:spin 4s linear infinite}

.song-title{font-size:24px;font-weight:600;text-align:center;margin:0}

          mask:radial-gradient(circle at 100% 0,transparent 10px,#000 10.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,transparent 10px,#000 10.5px) bottom/100% 51% no-repeat}

/* mapa */

/* stitch */

.env-seal{position:absolute;left:50%;top:78px;transform:translate(-50%,-50%);z-index:4;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8577f,#b63a62);
  display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 3px 6px rgba(0,0,0,.25);transition:opacity .3s,transform .3s}

.letter{background:#fffaf0;border-radius:10px;padding:22px 18px;box-shadow:0 8px 22px rgba(120,80,60,.15);position:relative;

/* final */
.card.final{background:linear-gradient(180deg,#fff8ee,#fdeef3)}

.songbar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 4px 12px rgba(120,90,140,.15);margin:8px 0 14px}
.songbar button{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(180deg,#f4a9c0,#e2849f);color:#fff;font-size:18px;box-shadow:0 3px 0 #c0577f}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const C = CONFIG;
const $ = s => document.querySelector(s);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const ease = {
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }
};
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function paragraphs(parent, text) { String(text || '').split(/\n\s*\n/).forEach(t => { if (t.trim()) parent.appendChild(el('p', null, t.trim())); }); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Aviso para el editor: tipos repetidos en días seguidos
for (let d = 2; d <= 24; d++) {
  const a = C.dias[d - 1], b = C.dias[d];
  if (a && b && a.tipo === b.tipo) console.warn(`⚠️ Los días ${d - 1} y ${d} tienen el mismo tipo (${a.tipo}).`);
  if (!b) console.warn(`⚠️ Falta el contenido del día ${d}.`);
}

/* =====================================================================
   PROGRESO GUARDADO (localStorage) + MODO PRUEBA
   ===================================================================== */
const STORE_KEY = 'adviento3d-' + String(C.nombre || 'amor').toLowerCase() + '-' + C.anio;
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s) return { opened: s.opened || [], found: s.found || [], canjeados: s.canjeados || [] }; } catch (e) {}
  return { opened: [], found: [], canjeados: [] };
}

let todayCache = null, todayAt = 0;
function madridToday() {
  const now = Date.now(); if (todayCache && now - todayAt < 20000) return todayCache;
  todayAt = now; return (todayCache = computeToday());
}
function computeToday() {
  try {
    const p = new Intl.DateTimeFormat('en-CA', { timeZone: C.zonaHoraria || 'Europe/Madrid', year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date());
    const g = t => +p.find(x => x.type === t).value;
    return { y: g('year'), m: g('month'), d: g('day') };
  } catch (e) { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() }; }
}
const dkey = (y, m, d) => y * 10000 + m * 100 + d;
function isUnlocked(day) { if (testMode) return true; const t = madridToday(); return dkey(t.y, t.m, t.d) >= dkey(C.anio, 12, day); }
function daysUntil(day) { const t = madridToday(); return Math.round((Date.UTC(C.anio, 11, day) - Date.UTC(t.y, t.m - 1, t.d)) / 864e5); }
function updateCountdown() {
  const n = daysUntil(25); let txt;
  if (n > 1) txt = `🎄 Faltan ${n} días para Navidad`;
  else if (n === 1) txt = '✨ ¡Hoy es Nochebuena! Mañana, Navidad';
  else if (n === 0) txt = '🎄 ¡Feliz Navidad! 🎄';
  else txt = '💕 Gracias por este diciembre';
  $('#countdown').textContent = txt;
}

function bellTone(f, t, vel, dest, decay = 1.8) {

  CHORDS.forEach((ch, i) => {
    const tb = t0 + i * 12 * S16;
    ch.forEach(n => {
      const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = nf(n);
      const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
      const g = actx.createGain(); g.gain.setValueAtTime(0.0001, tb); g.gain.linearRampToValueAtTime(0.07, tb + 0.5); g.gain.linearRampToValueAtTime(0.0001, tb + 12 * S16 + 0.3);
      o.connect(f); f.connect(g); g.connect(musicBus); o.start(tb); o.stop(tb + 12 * S16 + 0.4);

const fx = $('#fx'), fctx = fx.getContext('2d'); let parts = [], fxRunning = false;
function sizeFx() { const d = Math.min(devicePixelRatio, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0); }

const CONF_COLORS = ['#f4a9c0', '#a8cdf3', '#ffe3a3', '#e2b65b', '#cdb8f2', '#ffffff', '#f7c6a5'];
function confetti(n = 150) {
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < n; i++) parts.push({ x: W / 2 + rand(-W * 0.2, W * 0.2), y: H * 0.5, vx: rand(-8, 8), vy: rand(-15, -5), r: rand(0, 6.28), vr: rand(-0.15, 0.15),
    s: rand(10, 20), shape: Math.random() < 0.5 ? 'paw' : 'star', c: pick(CONF_COLORS), sway: rand(0, 6.28) });
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxStep); }
}
function drawPaw(s) {
  fctx.beginPath(); fctx.ellipse(0, s * 0.22, s * 0.33, s * 0.27, 0, 0, 7); fctx.fill();
  [[-0.38, -0.12], [-0.14, -0.36], [0.14, -0.36], [0.38, -0.12]].forEach(([x, y]) => { fctx.beginPath(); fctx.ellipse(x * s, y * s, s * 0.12, s * 0.15, x * 0.6, 0, 7); fctx.fill(); });
}
function drawStar(s) { fctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? s * 0.22 : s * 0.5, a = i * Math.PI / 5 - Math.PI / 2; fctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } fctx.closePath(); fctx.fill(); }
function fxStep() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 40);
  for (const p of parts) {
    p.vy += 0.3; p.vx *= 0.985; p.vy *= 0.995; p.sway += 0.08; p.x += p.vx + Math.sin(p.sway) * 0.8; p.y += p.vy; p.r += p.vr;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c;
    fctx.shadowColor = 'rgba(120,90,140,.25)'; fctx.shadowBlur = 3;
    p.shape === 'paw' ? drawPaw(p.s) : drawStar(p.s); fctx.restore();
  }
  if (parts.length) requestAnimationFrame(fxStep); else { fxRunning = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}

  });

  const legGeo = new THREE.CylinderGeometry(0.06, 0.055, 0.3, 6); legGeo.translate(0, -0.15, 0);
  [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sz]) => { const p = new THREE.Group(); p.position.set(sx * 0.14, 0.3, sz * 0.24); c.root.add(p); mesh(legGeo, fur, 0, 0, 0, p); const paw = mesh(EYE, belly, 0, -0.29, 0.02, p); paw.scale.set(0.065, 0.04, 0.075); c.legs.push(p); });

function setPose(c, pose) {
  c.pose = pose;
  const eyesClosed = pose === 'sleep';
  c.eyes.forEach(e => e.visible = !eyesClosed); c.closed.forEach(e => e.visible = eyesClosed);
  c.head.rotation.set(0, 0, 0);
  if (pose === 'walk') {
    c.body.position.set(0, 0.36, 0); c.body.rotation.set(0, 0, 0); c.body.scale.set(0.3, 0.27, 0.46);
    c.head.position.set(0, 0.6, 0.42);
    c.legs.forEach((l, i) => { l.visible = true; l.position.set((i % 2 ? 1 : -1) * 0.14, 0.3, (i < 2 ? 1 : -1) * 0.24); l.rotation.set(0, 0, 0); });
    c.tailRoot.position.set(0, 0.44, -0.4); c.tailRoot.rotation.set(-0.5, 0, 0); c.tailBase = [-0.25, 0];
  } else if (pose === 'sit') {
    c.body.position.set(0, 0.33, -0.04); c.body.rotation.set(-0.6, 0, 0); c.body.scale.set(0.29, 0.28, 0.4);
    c.head.position.set(0, 0.74, 0.16);
    c.legs.forEach((l, i) => { if (i < 2) { l.visible = true; l.position.set((i % 2 ? 1 : -1) * 0.1, 0.3, 0.16); l.rotation.set(0, 0, 0); } else { l.visible = true; l.position.set((i % 2 ? 1 : -1) * 0.2, 0.12, -0.02); l.rotation.set(-1.45, 0, 0); } });
    c.tailRoot.position.set(0, 0.08, -0.3); c.tailRoot.rotation.set(-1.5, 0, 0); c.tailBase = [0, 0.32];
  } else if (pose === 'sleep') {
    c.body.position.set(0, 0.22, 0); c.body.rotation.set(0, 0, 0); c.body.scale.set(0.36, 0.22, 0.42);
    c.head.position.set(0.12, 0.27, 0.34); c.head.rotation.set(0.35, 0.45, -0.3);
    c.legs.forEach(l => l.visible = false);
    c.tailRoot.position.set(0.05, 0.12, -0.36); c.tailRoot.rotation.set(-1.5, 0, 0); c.tailBase = [0, 0.48];
  }
}
function animTail(c, t, amp = 0.15, speed = 2) { c.tail.forEach((s, i) => { s.rotation.x = c.tailBase[0] + (i ? Math.sin(t * speed * 0.7 + i) * amp * 0.3 : 0); s.rotation.z = (i ? c.tailBase[1] : 0) + Math.sin(t * speed + i * 0.6) * amp; }); }

let partyMode = false;
function gatherAll(instant = false) {
  partyMode = true;
  const members = [cats.walker, animals.perrito, cats.play, cats.sleepy, animals.conejo, animals.pinguino];
  const n = members.length;
  members.forEach((m, i) => {
    const ang = (i - (n - 1) / 2) * 0.27, R = 4.15; const target = new THREE.Vector3(Math.sin(ang) * R, 0, Math.cos(ang) * R);
    if (m.legs) { m.party = true; setPose(m, 'sit'); }
    m.root.userData.baseY = 0; m.partyPhase = i * 0.7;
    if (m.shadow) m.shadow.visible = true;
    const from = m.root.position.clone(); const r0 = m.root.rotation.y; const r1 = ang;
    if (instant) { m.root.position.copy(target); m.root.rotation.y = r1; return; }
    m.gathering = true;
    tween(2.4, k => { const e = ease.inOutSine(k); m.root.position.lerpVectors(from, target, e); m.root.position.y = lerp(from.y, 0, e) + Math.abs(Math.sin(k * Math.PI * 5)) * 0.25 * (1 - k); m.root.rotation.y = lerp(r0, r1 + Math.PI * 2 * Math.round((r0 - r1) / (Math.PI * 2)), e); }, () => { m.gathering = false; m.root.rotation.y = r1; });
  });
}
function ungather() {

      items = items.filter(it => { if (it.y > H - 70 && it.y < H - 20 && Math.abs(it.x - catX) < 36) { score += it.t === 'f' ? 3 : 1; SFX.bells(); return false; } return it.y < H + 20; });
      draw();
      if (score >= goal && !won) { won = true; end(true); return; }
      if (tLeft <= 0) { end(false); return; }
      raf = requestAnimationFrame(loop);
    }
    function end(ok) { running = false; ov.classList.remove('hidden'); msg.textContent = ok ? `¡${score} estrellas! 🌟` : `¡Casi! ${score}/${goal} estrellas. ¿Otra vez?`; go.textContent = ok ? 'Jugar otra vez' : 'Reintentar'; if (ok) win(); }
    go.onclick = () => { size(); items = []; score = 0; tLeft = secs; won = false; catX = W / 2; ov.classList.add('hidden'); running = true; last = performance.now(); raf = requestAnimationFrame(loop); };
    requestAnimationFrame(() => { size(); catX = W / 2; draw(); });
    cleanup.push(() => cancelAnimationFrame(raf));
  },
  quiz(area, d, win) {
    const qs = d.preguntas || []; let i = 0, ok = 0;
    const prog = el('div', 'progress'); const bar = el('i'); prog.appendChild(bar); area.appendChild(prog); const box = el('div'); area.appendChild(box);
    const show = () => {
      box.innerHTML = ''; bar.style.width = (i / qs.length * 100) + '%';
      if (i >= qs.length) { const r = el('div', 'win', `${ok}/${qs.length} aciertos. ${ok === qs.length ? d.premio : ok >= qs.length / 2 ? '¡Muy bien! Pero aún hay cosas que contarte 😉' : '¡Habrá que pasar más tiempo juntos para estudiar! 😂'}`); box.appendChild(r); if (ok >= qs.length / 2) { confetti(140); SFX.chime(); } return; }
      const q = qs[i]; box.appendChild(el('div', 'quiz-q', `${i + 1}. ${q.pregunta}`));
      q.opciones.forEach((o, k) => { const bt = el('button', 'quiz-opt', o); box.appendChild(bt);
        bt.onclick = () => { if (box.dataset.done) return; box.dataset.done = 1; const good = k === q.correcta; if (good) { ok++; SFX.sparkle(); } else SFX.meow(0.8, true);
          bt.classList.add(good ? 'good' : 'bad'); box.querySelectorAll('.quiz-opt')[q.correcta].classList.add('good');
          setTimeout(() => { delete box.dataset.done; i++; show(); }, 1100); }; });
    };
    show();
  }
};
let leafletP = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  return leafletP || (leafletP = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = () => res(window.L); s.onerror = () => { leafletP = null; rej(); }; document.head.appendChild(s);
  }));
}

/* =====================================================================
   MODO PRUEBA (tocar 5 veces el título)
   ===================================================================== */
let taps = 0, lastTap = 0;
$('#title').addEventListener('click', () => {
  const now = performance.now(); taps = now - lastTap < 1200 ? taps + 1 : 1; lastTap = now;
  if (taps >= 5) { taps = 0; setTestMode(!testMode); }
});
function setTestMode(on) {
  testMode = on; if (!on) { test.opened.clear(); test.found.clear(); test.canjeados.clear(); }
  $('#testBadge').hidden = !on; refreshGifts(); updatePaw();
  if (!on && partyMode && !isOpened(24)) ungather();
  toast(on ? '🔧 Modo prueba activado: todo se puede abrir y no se guarda nada' : '✅ Modo prueba desactivado', 3000);
}
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('¿Borrar todo el progreso guardado en este móvil? (cajas abiertas, animalitos y vales)')) return;
  state = { opened: [], found: [], canjeados: [] }; test.opened.clear(); test.found.clear(); test.canjeados.clear();
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  refreshGifts(); updatePaw(); if (partyMode) ungather(); toast('🧹 Progreso borrado');
});

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
const clock = new THREE.Clock();
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); sizeFx();
}
addEventListener('resize', onResize);
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = performance.now();
  runTweens(now);
  for (const u of updaters) u(t, dt);
  Object.values(cats).forEach(c => c.update && c.update(t, dt));
  Object.values(animals).forEach(a => a.update && a.update(t, dt));
  if (!controls.autoRotate && now - lastInteract > 15000 && !$('#modal').classList.contains('show')) controls.autoRotate = true;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function boot() {
  try { await Promise.race([document.fonts.load('700 80px Fredoka'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  buildGifts(); buildCats(); buildAnimals(); refreshGifts(); updatePaw(); updateCountdown(); setInterval(updateCountdown, 60000);
  if (isOpened(24)) gatherAll(true);
  window.__openDay = d => onGiftTap(gifts[d - 1]); // atajo de depuración para la consola
  $('#loading').remove();
  frame();
  const btn = $('#enterBtn'); btn.disabled = false; btn.textContent = C.inicio.boton;
  btn.addEventListener('click', () => {
    initAudio(); SFX.bells(); $('#intro').classList.add('hide');
    lastInteract = performance.now();
    setTimeout(() => {
      const today = madridToday(); const d = today.m === 12 && today.y === C.anio ? today.d : 0;
      if (d >= 1 && d <= 24 && !isOpened(d)) toast(`🎁 ¡La cajita ${d} ya se puede abrir! Busca la que brilla ✨`, 3600);
      else if (daysUntil(1) > 0) toast(`⏳ Faltan ${daysUntil(1)} días para abrir la primera cajita`, 3600);
    }, 1200);
    setTimeout(() => { if (foundCount() < 3 && !$('#modal').classList.contains('show')) toast('Psst… hay 3 animalitos escondidos por la escena 🐾', 3200); }, 30000);
  }, { once: true });
  $('#muteBtn').addEventListener('click', () => { initAudio(); setMuted(!muted); });
}
boot();
